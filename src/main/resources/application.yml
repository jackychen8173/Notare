spring:
  application:
    name: notare
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Railway's Serverless mode sleeps the service after 10 minutes with no outbound traffic.
      # HikariCP's defaults (10 connections held open forever, keepalive every 2 minutes) would
      # keep it awake. With no minimum, idle connections close after 30s and the pool goes quiet;
      # the first request after that pays one connection setup (milliseconds on Railway's
      # private network).
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # One file per upload, capped by files.max-bytes (10 MB); a little headroom for the form fields.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # Default is 200 - real traffic here is a handful of requests/hour, and each idle worker
      # thread reserves its own stack (~1MB default), so the default pool size just sits there
      # costing memory for no reason. 10 is generous headroom for current usage; raise it if
      # traffic ever actually grows enough to need it.
      max: 10

# File uploads, see com.notare.file. With S3_BUCKET set, files go to that bucket (on Railway these
# are variable references to the bucket's own credentials, so no secret is copied by hand).
# FILES_LOCAL_DIR instead keeps them on local disk, for development and tests only. With neither,
# uploads are turned off (503) rather than saved to a container disk that's wiped on redeploy.
files:
  max-bytes: 10485760
  quota-bytes: ${FILES_QUOTA_BYTES:209715200}
  local-dir: ${FILES_LOCAL_DIR:}
  s3:
    bucket: ${S3_BUCKET:}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    access-key-id: ${S3_ACCESS_KEY_ID:}
    secret-access-key: ${S3_SECRET_ACCESS_KEY:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Sign in with Google - audience for verifying a Google ID token, see
# com.notare.auth.GoogleIdTokenVerifierConfig.
google:
  oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Account emails (password reset, email verification), see com.notare.email. Without
# RESEND_API_KEY nothing is sent: the backend logs that it skipped the email, and logs the body
# (with its one-time link) only when EMAIL_LOG_CONTENT=true, which is for local development only.
# APP_BASE_URL is the frontend address the links point at.
email:
  resend-api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:Notare <onboarding@resend.dev>}
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  log-content: ${EMAIL_LOG_CONTENT:false}

# Limits on the public account endpoints, see com.notare.auth.AuthRateLimits.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}

# Error tracking. Without SENTRY_DSN the SDK stays off (local runs, tests). Every logged ERROR
# becomes a Sentry event, which is how handled 5xx errors get there (GlobalExceptionHandler logs
# them). No tracing and no personal data: students are often minors, and tracing would spend the
# free quota. The SDK only sends when there's an error, so it doesn't keep the backend awake.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${RAILWAY_ENVIRONMENT_NAME:local}
  release: ${RAILWAY_GIT_COMMIT_SHA:local}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# Internal call from the backend to the Next.js /api/code-run route, which is the thing that
# actually talks to Vercel Sandbox - see com.notare.coderun and CLAUDE.md.
code-run:
  service-url: ${CODE_RUN_SERVICE_URL:http://localhost:3000}
  internal-secret: ${CODE_RUN_INTERNAL_SECRET}
