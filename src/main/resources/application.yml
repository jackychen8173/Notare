spring:
  application:
    name: notare
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Railway's Serverless mode sleeps the service after 10 minutes with no outbound traffic.
      # HikariCP's defaults (10 connections held open forever, keepalive every 2 minutes) would
      # keep it awake. With no minimum, idle connections close after 30s and the pool goes quiet;
      # the first request after that pays one connection setup (milliseconds on Railway's
      # private network).
      minimum-idle: 0
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # Default is 200 - real traffic here is a handful of requests/hour, and each idle worker
      # thread reserves its own stack (~1MB default), so the default pool size just sits there
      # costing memory for no reason. 10 is generous headroom for current usage; raise it if
      # traffic ever actually grows enough to need it.
      max: 10

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Sign in with Google - audience for verifying a Google ID token, see
# com.notare.auth.GoogleIdTokenVerifierConfig.
google:
  oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Account emails (password reset, email verification), see com.notare.email. Without
# RESEND_API_KEY nothing is sent: the backend logs that it skipped the email, and logs the body
# (with its one-time link) only when EMAIL_LOG_CONTENT=true, which is for local development only.
# APP_BASE_URL is the frontend address the links point at.
email:
  resend-api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:Notare <onboarding@resend.dev>}
  app-base-url: ${APP_BASE_URL:http://localhost:3000}
  log-content: ${EMAIL_LOG_CONTENT:false}

# Limits on the public account endpoints, see com.notare.auth.AuthRateLimits.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}

# Internal call from the backend to the Next.js /api/code-run route, which is the thing that
# actually talks to Vercel Sandbox - see com.notare.coderun and CLAUDE.md.
code-run:
  service-url: ${CODE_RUN_SERVICE_URL:http://localhost:3000}
  internal-secret: ${CODE_RUN_INTERNAL_SECRET}
