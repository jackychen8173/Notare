spring:
  application:
    name: notare
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Internal call from the backend to the Next.js /api/code-run route, which is the thing that
# actually talks to Vercel Sandbox - see com.notare.coderun and CLAUDE.md.
code-run:
  service-url: ${CODE_RUN_SERVICE_URL:http://localhost:3000}
  internal-secret: ${CODE_RUN_INTERNAL_SECRET}
